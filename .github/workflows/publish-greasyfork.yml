name: Publish Greasy Fork

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'package name to publish (e.g. captcha-ocr)'
        required: true
        default: 'captcha-ocr'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve package name
        id: pkg
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_PACKAGE" ]; then
            pkg="$INPUT_PACKAGE"
          else
            pkg="${GITHUB_REF_NAME%-v*}"
          fi
          if [ ! -f "packages/$pkg/package.json" ]; then
            echo "::error::package packages/$pkg not found"
            exit 1
          fi
          echo "name=$pkg" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ${{ steps.pkg.outputs.name }} build

      - name: Push to greasyfork branch
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="packages/$PKG/dist/$PKG.user.js"
          if [ ! -f "$artifact" ]; then
            echo "::error::$artifact not found"
            exit 1
          fi

          version="${GITHUB_REF_NAME#*-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version=""
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin greasyfork:refs/remotes/origin/greasyfork; then
            git switch --force-create greasyfork refs/remotes/origin/greasyfork
          else
            git switch --orphan greasyfork
          fi

          cp "$artifact" "$PKG.user.js"
          printf '%s\n' \
            '# Greasy Fork build output' \
            '' \
            'This branch is generated by GitHub Actions. Do not edit directly.' \
            'Greasy Fork syncs `*.user.js` files from this branch via webhook.' \
            > README.md

          git add "$PKG.user.js" README.md
          if git diff --cached --quiet; then
            echo "greasyfork branch is already up to date."
            exit 0
          fi

          if [ -n "$version" ]; then
            git commit -m "publish: $PKG v$version"
          else
            git commit -m "publish: $PKG (manual)"
          fi
          git push origin greasyfork

          echo "::notice::Greasy Fork sync URL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/greasyfork/${PKG}.user.js"
